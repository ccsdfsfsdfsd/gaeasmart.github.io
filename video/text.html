<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Three.js 波动点云球体</title>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 创建柔和圆形点纹理
function createCircleTexture(size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}
const pointTexture = createCircleTexture();

// 球点几何
const radius = 1.6;
const detail = 120;
const geometry = new THREE.SphereGeometry(radius, detail, detail);

// shader 材质
const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
        time: { value: 0 },
        amplitude: { value: 0.1 },
        color: { value: new THREE.Color(0x3366ff) },
        lightPosition: { value: new THREE.Vector3(5, 5, 5) }
    },
  vertexShader: `
    uniform float time;
    uniform float amplitude;
    attribute vec3 position;
    varying float vNoise;
    // 简单分层噪声
    float noise(vec3 p){
      return sin(p.x*3.1 + time*1.2) +
             sin(p.y*2.7 - time*1.5) +
             sin(p.z*4.3 + time*1.7);
    }
    void main() {
      float n = noise(position * 1.2) * 0.2 * amplitude;
      vec3 newPosition = normalize(position) * (1.6 + n);
      vNoise = n;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
      gl_PointSize = 3.5 * (300.0 / -mvPosition.z);
    }
  `,
  fragmentShader: `
    uniform sampler2D pointTexture;
    varying float vNoise;
    void main() {
      vec4 texColor = texture2D(pointTexture, gl_PointCoord);
      vec3 color1 = vec3(0.0, 0.9, 1.0); // 青蓝
      vec3 color2 = vec3(1.0, 0.2, 0.3); // 红色
      vec3 finalColor = mix(color1, color2, (vNoise+0.2)*1.5);
      gl_FragColor = vec4(finalColor, texColor.a * 0.9);
      if (gl_FragColor.a < 0.05) discard;
    }
  `
});

const points = new THREE.Points(geometry, material);
scene.add(points);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  material.uniforms.time.value = clock.getElapsedTime();
  points.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
